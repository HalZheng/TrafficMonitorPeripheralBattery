name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: x86
            cmake_arch: Win32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build/${{ matrix.arch }} -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }}

      - name: Build
        run: cmake --build build/${{ matrix.arch }} --config Release

      - name: Test
        if: matrix.arch == 'x64'
        run: ctest --test-dir build/${{ matrix.arch }} -C Release --output-on-failure

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: PeripheralBatteryPlugin-${{ matrix.arch }}
          path: bin/${{ matrix.arch }}/PeripheralBatteryPlugin.dll
          if-no-files-found: error
