name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msvc_arch: x64
          - arch: x86
            msvc_arch: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure
        shell: pwsh
        run: |
          if (Get-Command ninja -ErrorAction SilentlyContinue) {
              cmake -S . -B build/${{ matrix.arch }} -G Ninja -DCMAKE_BUILD_TYPE=Release
          } else {
              cmake -S . -B build/${{ matrix.arch }} -G 'NMake Makefiles' -DCMAKE_BUILD_TYPE=Release
          }

      - name: Build
        run: cmake --build build/${{ matrix.arch }}

      - name: Test
        if: matrix.arch == 'x64'
        run: ctest --test-dir build/${{ matrix.arch }} --output-on-failure

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: PeripheralBatteryPlugin-${{ matrix.arch }}
          path: bin/${{ matrix.arch }}/PeripheralBatteryPlugin.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plugin artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $content = Get-Content CMakeLists.txt -Raw
          if ($content -notmatch 'project\([^)]*VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
              throw 'cannot read the project version from CMakeLists.txt'
          }
          $expected = "v$($Matches[1])"
          if ($expected -ne '${{ github.ref_name }}') {
              throw "tag ${{ github.ref_name }} does not match CMakeLists version $expected"
          }

      - name: Stage DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin\x64,bin\x86 | Out-Null
          Copy-Item artifacts\PeripheralBatteryPlugin-x64\PeripheralBatteryPlugin.dll bin\x64\
          Copy-Item artifacts\PeripheralBatteryPlugin-x86\PeripheralBatteryPlugin.dll bin\x86\

      - name: Package
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
